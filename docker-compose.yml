version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: diagnosticos-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: diagnosticos
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: diagnosticos-redis
    ports:
      - "6382:6379"

volumes:
  pgdata:
